name = "graveatlas-backend"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Environment variables — DO NOT put real secrets here.
# Set real values via: wrangler secret put SECRET_NAME

[vars]
# Example/placeholder values only — real secrets set via wrangler secret
# GITHUB_APP_ID = "YOUR_APP_ID"
# GITHUB_INSTALLATION_ID = "YOUR_INSTALLATION_ID"
# GITHUB_OWNER = "YOUR_GITHUB_USERNAME"
# GITHUB_REPO = "kubur-sg-data"
# GITHUB_BRANCH = "main"
# ADMIN_TOKEN = "YOUR_ADMIN_TOKEN"

# GITHUB_PRIVATE_KEY must be set via: wrangler secret put GITHUB_PRIVATE_KEY
