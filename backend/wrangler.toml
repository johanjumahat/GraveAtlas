name = "graveatlas"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Environment variables — non-secret values only.
# Set real values via: wrangler secret put SECRET_NAME

[vars]
GITHUB_OWNER = "putraworks2026"
GITHUB_REPO = "graveatlas-data"
GITHUB_BRANCH = "main"

# Secrets — DO NOT put real values here. Set via wrangler secret put.
# GITHUB_APP_ID — numeric App ID
# GITHUB_PRIVATE_KEY — PEM private key
# GITHUB_INSTALLATION_ID — numeric installation ID
# ADMIN_TOKEN — admin authentication token
# GOOGLE_CLIENT_ID — Google OAuth Web Client ID (for verifying ID tokens)
# ALLOWED_ORIGIN — optional, for web admin UI CORS (e.g., https://admin.example.com)

# ── Staging environment ──
# Deploy with: wrangler deploy --env staging
# Uses a separate data repo branch so staging tests never touch production data.
# Secrets must be set per-environment:
#   wrangler secret put GITHUB_APP_ID --env staging
#   wrangler secret put GITHUB_PRIVATE_KEY --env staging
#   wrangler secret put GITHUB_INSTALLATION_ID --env staging
#   wrangler secret put ADMIN_TOKEN --env staging

[env.staging]
name = "graveatlas-staging"
vars = { GITHUB_OWNER = "putraworks2026", GITHUB_REPO = "graveatlas-data", GITHUB_BRANCH = "staging" }
