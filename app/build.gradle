plugins {
    id 'com.android.application'
}

// ── Versioning ──
def versionProps = new Properties()
def versionPropsFile = rootProject.file('version.properties')
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}
def appVersionName = project.findProperty('versionName') ?: versionProps.getProperty('versionName', '1.0.0')
def appVersionCode = project.findProperty('versionCode') ?
    project.property('versionCode').toInteger() :
    Integer.parseInt(versionProps.getProperty('versionCode', '1'))

android {
    namespace 'com.putraworks.graveatlas'
    compileSdk 35

    defaultConfig {
        applicationId "com.putraworks.graveatlas"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            def ciKeystore = project.findProperty('signingKeystoreFile')
            if (ciKeystore != null) {
                storeFile file(ciKeystore)
                storeType "pkcs12"
                storePassword project.findProperty('signingKeystorePassword') ?: ''
                keyAlias project.findProperty('signingKeyAlias') ?: ''
                keyPassword project.findProperty('signingKeyPassword') ?: ''
            } else {
                def localProps = new Properties()
                def localPropsFile = rootProject.file('local.properties')
                if (localPropsFile.exists()) {
                    localProps.load(new FileInputStream(localPropsFile))
                }
                def keystorePath = localProps.getProperty('keystore.file', '')
                if (!keystorePath.isEmpty() && rootProject.file(keystorePath).exists()) {
                    storeFile rootProject.file(keystorePath)
                    storeType localProps.getProperty('keystore.type', 'pkcs12')
                    storePassword localProps.getProperty('keystore.storePassword', '')
                    keyAlias localProps.getProperty('keystore.keyAlias', '')
                    keyPassword localProps.getProperty('keystore.keyPassword', '')
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.work:work-runtime:2.9.0'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // Fragment
    implementation 'androidx.fragment:fragment:1.6.2'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.6.0'

    // Encrypted SharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
}
